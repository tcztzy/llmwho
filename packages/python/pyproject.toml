[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llmwho"
version = "0.1.0"
description = "Passive LLM endpoint identity and stability instrumentation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "LLMWho contributors" }]
keywords = ["llm", "observability", "fingerprinting", "stability", "middleware"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.optional-dependencies]
test = ["httpx>=0.24", "requests>=2.28"]

[project.urls]
Homepage = "https://github.com/tcztzy/llmwho"
Repository = "https://github.com/tcztzy/llmwho"
Issues = "https://github.com/tcztzy/llmwho/issues"

[project.scripts]
llmwho = "llmwho.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwho"]

[tool.hatch.build.targets.sdist]
include = ["src/llmwho", "README.md", "LICENSE", "pyproject.toml"]
