name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: packages/python/uv.lock
      - name: Check locked dependencies
        run: uv lock --project packages/python --check
      - name: Run pre-commit
        run: uvx --from pre-commit==4.6.0 pre-commit run --all-files --show-diff-on-failure
      - name: Check repository contracts
        run: python -m unittest tests/test_repository_contract.py -v

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: packages/python/uv.lock
      - name: Test Python package
        run: >-
          uv run --frozen --project packages/python --extra test
          python -m unittest discover -s packages/python/tests -v

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "24"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: packages/python/uv.lock
      - name: Install Node dependencies
        run: npm ci --prefix packages/node
      - name: Type-check Node package
        run: npm run typecheck --prefix packages/node
      - name: Test Node package
        run: npm test --prefix packages/node
        env:
          LLMWHO_RUN_UV_INTEGRATION: ${{ matrix.node-version == '24' && '1' || '0' }}
      - name: Build Node package
        run: npm run build --prefix packages/node

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build non-root Collector image
        run: docker build --tag llmwho:ci .
      - name: Smoke-test health, auth, and data API
        run: scripts/smoke-container.sh llmwho:ci
