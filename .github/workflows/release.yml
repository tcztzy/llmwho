name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Match tag to package versions
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Check repository contracts
        run: python -m unittest tests/test_repository_contract.py -v

  build-python:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: packages/python/uv.lock
      - name: Test Python package
        run: >-
          uv run --frozen --project packages/python --extra test
          python -m unittest discover -s packages/python/tests -v
      - name: Build Python distributions
        run: uv build --project packages/python --out-dir dist/python
      - name: Check Python distributions
        run: uvx --from twine==6.2.0 twine check dist/python/*
      - name: Smoke-test wheel
        run: >-
          uv run --isolated --no-project --with dist/python/*.whl
          python scripts/smoke-python-package.py "$GITHUB_REF_NAME"
      - name: Smoke-test source distribution
        run: >-
          uv run --isolated --no-project --with dist/python/*.tar.gz
          python scripts/smoke-python-package.py "$GITHUB_REF_NAME"
      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-python
          path: dist/python/*
          if-no-files-found: error

  build-node:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Install npm trusted-publishing client
        run: npm install --global npm@12.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          enable-cache: true
          cache-dependency-glob: packages/python/uv.lock
      - name: Install Node dependencies
        run: npm ci --prefix packages/node
      - name: Type-check Node package
        run: npm run typecheck --prefix packages/node
      - name: Test Node package and Python bridge
        run: npm test --prefix packages/node
        env:
          LLMWHO_RUN_UV_INTEGRATION: "1"
      - name: Build Node package
        run: npm run build --prefix packages/node
      - name: Pack Node distribution
        working-directory: packages/node
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/node"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist/node"
          npm publish --dry-run --json > /dev/null
      - name: Smoke-test installed Node distribution
        run: scripts/smoke-node-package.sh dist/node/*.tgz
      - name: Upload Node distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-node
          path: dist/node/*.tgz
          if-no-files-found: error

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-python
          path: dist
      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/

  publish-npm:
    needs: build-node
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Node distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-node
          path: dist
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install npm trusted-publishing client
        run: npm install --global npm@12.0.1
      - name: Publish to npm with OIDC
        run: npm publish dist/*.tgz --access public

  github-release:
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-python
          path: dist/python
      - name: Download Node distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-node
          path: dist/node
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist -type f -print | sort)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
